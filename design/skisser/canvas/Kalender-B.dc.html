<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Kalender som adventsrekke</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#8fd3ff}a:hover{color:#e3ebf5}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #1b1f33; font-family: 'Pixelify Sans', system-ui, sans-serif; color: #e3ebf5">
  <img src="/_blob/208487001bd7ece0606173aba742917e" alt="Spillverdenen" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated">

  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 14px 24px 16px; background: linear-gradient(#1b1f33f2, #1b1f33cc); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; gap: 16px">
      <span style="font-family: 'Jersey 10', 'Pixelify Sans', sans-serif; font-size: 32px; line-height: 1">Julekalenderen</span>
      <span style="font-size: 14px; color: #c0cbdc">6 av 8 åpne luker ferdig · 20 poeng</span>
      <span style="flex: 1"></span>
      <span style="padding: 5px 10px; font-size: 13px; color: #c0cbdc; box-shadow: inset 0 0 0 2px #3a4263"><span style="color: #f03e2f">■</span> Sanity Studio</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 6px">
      <sc-for list="{{doors}}" as="d" hint-placeholder-count="24">
        <div style="position: relative; width: {{d.w}}px; height: {{d.h}}px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px 0 5px; box-sizing: border-box; background: {{d.bg}}; box-shadow: {{d.ring}}">
          <span style="font-family: 'Jersey 10', 'Pixelify Sans', sans-serif; font-size: {{d.fs}}px; line-height: 0.9; color: {{d.numColor}}">{{d.n}}</span>
          <sc-if value="{{d.hasIcon}}" hint-placeholder-val="{{ false }}">
            <img src="{{d.icon}}" alt="" style="width: 24px; height: 24px; image-rendering: pixelated">
          </sc-if>
          <span style="font-size: 10px; color: {{d.markColor}}">{{d.mark}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; top: 172px; left: 410px; width: 340px; padding: 14px 16px; background: rgba(38, 43, 68, 0.96); border: 2px solid #1b1f33; box-shadow: inset 0 0 0 2px #fdbe53; display: flex; flex-direction: column; gap: 8px">
    <div style="position: absolute; top: -12px; left: 20px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 10px solid #fdbe53"></div>
    <span style="font-size: 13px; color: #fdbe53">Luke 8 · i dag</span>
    <span style="font-size: 19px; line-height: 1.25">Lag en egen document type for monstre</span>
    <span style="font-size: 13px; color: #c0cbdc">ca. 20 min · 3 poeng</span>
    <span style="font-size: 14px">Gå til Brann ved smia for å få oppgaven <span style="padding: 0 5px; background: #3a4263; font-size: 12px">E</span></span>
  </div>

  <div style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; background: rgba(38, 43, 68, 0.94); border: 2px solid #1b1f33">
    <div style="width: 52px; height: 52px; display: grid; place-items: center; background: #1b1f33; box-shadow: inset 0 0 0 2px #fdbe53"><img src="/_blob/564c767e26e4d22f71dba28a993ca8e9" alt="Sverd" style="width: 40px; height: 40px; image-rendering: pixelated"></div>
    <div style="width: 52px; height: 52px; display: grid; place-items: center; background: #1b1f33"><img src="/_blob/e1bdd56373651fb72699fe7cd84d68a8" alt="Øks" style="width: 40px; height: 40px; image-rendering: pixelated"></div>
    <div style="width: 52px; height: 52px; display: grid; place-items: center; background: #1b1f33"><img src="/_blob/3cc2246536ea30bf96eb116e16545a60" alt="Hammer" style="width: 40px; height: 40px; image-rendering: pixelated"></div>
    <div style="width: 52px; height: 52px; background: #1b1f33"></div>
    <div style="width: 52px; height: 52px; background: #1b1f33"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const icons = {
  1: '/_blob/564c767e26e4d22f71dba28a993ca8e9',
  2: '/_blob/bff06d00b77e04bc0a49acee816ce39f',
  3: '/_blob/faef14ffa4c21020995fc2751626d46c',
  4: '/_blob/e1bdd56373651fb72699fe7cd84d68a8',
  5: '/_blob/1d6a0615ea99491d77d7158453be16e1',
  7: '/_blob/3cc2246536ea30bf96eb116e16545a60'
};
const state = (n) => (icons[n] ? 'done' : n === 6 ? 'open' : n === 8 ? 'today' : n === 24 ? 'eve' : 'locked');
const look = {
  done: ['#2c5a4b', 'inset 0 0 0 2px #3f7a66', '#e3ebf5', '✓', '#6fd1a8'],
  open: ['#3a4263', 'inset 0 0 0 2px #fdbe53', '#e3ebf5', 'åpen', '#fdbe53'],
  today: ['#e38628', 'inset 0 0 0 2px #fdbe53, 0 0 0 3px #1b1f33, 0 0 0 5px #fdbe53', '#2a140e', 'i dag', '#2a140e'],
  locked: ['#20253a', 'inset 0 0 0 2px #2b3150', '#5a6488', '', '#5a6488'],
  eve: ['#20253a', 'inset 0 0 0 2px #f03e2f', '#f03e2f', 'jul', '#f03e2f']
};
const doors = [];
for (let n = 1; n <= 24; n++) {
  const s = state(n);
  const l = look[s];
  const big = s === 'today';
  doors.push({
    n, w: big ? 60 : 44, h: big ? 76 : 62, fs: big ? 30 : 22,
    bg: l[0], ring: l[1], numColor: l[2], mark: l[3], markColor: l[4],
    hasIcon: Boolean(icons[n]), icon: icons[n] || ''
  });
}
return { doors };
}
}
</script>
</body>
</html>
