<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Klassisk julekalender</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#8fd3ff}a:hover{color:#e3ebf5}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #1b1f33; font-family: 'Pixelify Sans', system-ui, sans-serif; color: #e3ebf5">
  <img src="/_blob/208487001bd7ece0606173aba742917e" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.25; image-rendering: pixelated">

  <div style="position: absolute; left: 80px; top: 36px; width: 1120px; height: 728px; background: #763b36; box-shadow: inset 0 0 0 4px #2e1d25, inset 0 0 0 8px #bd6c4a; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; flex: 1; overflow: hidden; box-shadow: inset 0 0 0 2px #2e1d25">
      <img src="/_blob/208487001bd7ece0606173aba742917e" alt="Vinterbilde av bygda" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; filter: brightness(1.25) saturate(0.9)">
      <sc-for list="{{doors}}" as="d" hint-placeholder-count="24">
        <div style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.h}}px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 4px; background: {{d.bg}}; box-shadow: {{d.ring}}">
          <span style="font-family: 'Jersey 10', 'Pixelify Sans', sans-serif; font-size: {{d.fs}}px; line-height: 0.9; color: {{d.numColor}}">{{d.n}}</span>
          <sc-if value="{{d.hasIcon}}" hint-placeholder-val="{{ false }}">
            <img src="{{d.icon}}" alt="" style="width: 28px; height: 28px; image-rendering: pixelated">
          </sc-if>
          <span style="font-size: 11px; color: {{d.markColor}}">{{d.mark}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 10px 14px; background: #2e1d25">
      <span style="font-family: 'Jersey 10', 'Pixelify Sans', sans-serif; font-size: 30px; line-height: 1; color: #f4e4cf">Sanity-julekalenderen 2026</span>
      <span style="flex: 1"></span>
      <span style="font-size: 14px; color: #f4e4cf">I dag: <span style="color: #fdbe53">luke 8, ny document type</span></span>
      <span style="padding: 6px 12px; background: #e38628; box-shadow: inset 0 2px 0 #fdbe53; color: #2a140e; font-size: 14px; font-weight: 600">Åpne luke 8</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const icons = {
  1: '/_blob/564c767e26e4d22f71dba28a993ca8e9',
  2: '/_blob/bff06d00b77e04bc0a49acee816ce39f',
  3: '/_blob/faef14ffa4c21020995fc2751626d46c',
  4: '/_blob/e1bdd56373651fb72699fe7cd84d68a8',
  5: '/_blob/1d6a0615ea99491d77d7158453be16e1',
  7: '/_blob/3cc2246536ea30bf96eb116e16545a60'
};
const order = [7, 19, 3, 12, 15, 10, 1, 22, 5, 17, 8, 14, 21, 6, 11, 2, 18, 4, 16, 9, 23, 13, 20];
const jx = [0, 18, -10, 12, -6, 20, 8, -14, 16, 0, -8, 14, 6, -12, 10, -4, 18, -16, 4, 12, -10, 8, -6];
const jy = [6, -8, 12, 0, -10, 8, -6, 10, 0, 14, -4, 6, -12, 4, 10, -8, 2, 12, -6, 0, 8, -10, 6];
const look = {
  done: ['#2c5a4b', 'inset 0 0 0 3px #3f7a66, 3px 3px 0 #1b1f33', '#e3ebf5', '✓', '#6fd1a8'],
  open: ['#3a4263', 'inset 0 0 0 3px #fdbe53, 3px 3px 0 #1b1f33', '#e3ebf5', 'åpen', '#fdbe53'],
  today: ['#e38628', 'inset 0 0 0 3px #fdbe53, 0 0 0 4px #fdbe53, 4px 4px 0 6px #1b1f33', '#2a140e', 'i dag', '#2a140e'],
  locked: ['#f4e4cf', 'inset 0 0 0 3px #bd6c4a, 3px 3px 0 #1b1f33', '#763b36', '', '#763b36'],
  eve: ['#f03e2f', 'inset 0 0 0 3px #f4e4cf, 4px 4px 0 #1b1f33', '#f4e4cf', 'julaften', '#f4e4cf']
};
const state = (n) => (icons[n] ? 'done' : n === 6 ? 'open' : n === 8 ? 'today' : n === 24 ? 'eve' : 'locked');
const doors = order.map((n, i) => {
  const col = i % 6, row = Math.floor(i / 6);
  const l = look[state(n)];
  return {
    n, x: 40 + col * 166 + jx[i], y: 26 + row * 140 + jy[i], w: 84, h: 92, fs: 34,
    bg: l[0], ring: l[1], numColor: l[2], mark: l[3], markColor: l[4],
    hasIcon: Boolean(icons[n]), icon: icons[n] || ''
  };
});
const eve = look.eve;
doors.push({ n: 24, x: 862, y: 446, w: 160, h: 110, fs: 52, bg: eve[0], ring: eve[1], numColor: eve[2], mark: eve[3], markColor: eve[4], hasIcon: false, icon: '' });
return { doors };
}
}
</script>
</body>
</html>
